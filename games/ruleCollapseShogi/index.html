<!DOCTYPE html>
<html lang="js">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルール崩壊将棋</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>

</head>

<body>

    <div class="d-flex flex-column text-center">

        <!-- 操作メニュー -->
        <div class="controllMenu mx-auto p-3" id="controlMenu">
            <div class="d-flex flex-wrap matchWrap">
                <select id="easyLvElm"></select>
                <button id="matchCPU">CPUと対戦</button>
                <button id="stopCPUElm">CPU停止</button>
                <button id="startCPUElm">CPU再開</button>
            </div>

            <div class="d-flex flex-wrap matchWrap">
                <input id="roomPw" size="8" type="text" value="" placeholder="あいことば">
                <button id="startMatch">検索</button>
            </div>

        </div>
    </div>

    
    <script src="js/dialog.js"></script>
    <script src="js/gameLib/gameLib.js"></script>
    <script src="js/piece.js"></script>
    <script src="js/init.js"></script>
    <script src="js/player.js"></script>
    <script src="js/events.js"></script>
    <script src="js/draw.js"></script>
</body>

</html>
