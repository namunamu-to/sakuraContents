<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません</title>
  <link rel="stylesheet" href="/css/yachiyo.css">
</head>

<body>
  <script src="/js/header.js"></script>

  <main>
    <section>
      <h1>404 Not Found</h1>
      <p>お探しのページは見つかりませんでした。</p>
      <p>URLが間違っているか、ページが移動または削除された可能性があります。</p>
      <p><span id="countdown">5</span>秒後にトップページへ移動します。</p>
      <p><a href="https://www.yachiyo.tech/index.html">すぐにトップページへ移動する</a></p>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const countdownElement = document.getElementById('countdown');
      let seconds = parseInt(countdownElement.textContent, 10);

      const countdown = () => {
        if (seconds <= 0) {
          window.location.href = 'https://www.yachiyo.tech/index.html';
          return;
        }
        seconds--;
        countdownElement.textContent = seconds;
      };

      setInterval(countdown, 1000);
    });
  </script>
  <script src="/js/footer.js"></script>
</body>

</html>
