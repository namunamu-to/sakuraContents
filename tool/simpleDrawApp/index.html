<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お絵描きメモ（背景付き保存）</title>
  <style>
    body {
      text-align: center;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }
    #toolMenu {
      width: 95vw;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #f5f5f5;
      border-bottom: 1px solid #ccc;
      flex-wrap: wrap;
    }
    #canvas {
      display: block;
      margin: 0 auto;
      border: 1px solid #000;
      touch-action: none;
      cursor: none;
    }
    #cursorPreview {
      position: absolute;
      border: 2px solid #666;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      mix-blend-mode: difference;
    }
    input[type="number"] {
      width: 60px;
      text-align: right;
    }
    #exportMenu {
      position: absolute;
      top: 60px;
      right: 30px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      z-index: 1000;
    }
    #exportMenu button {
      padding: 8px 12px;
      border: none;
      background: white;
      cursor: pointer;
      text-align: left;
      width: 120px;
    }
    #exportMenu button:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div id="toolMenu">
    <button id="undoBtn">戻る(Ctrl+Z)</button>
    <label for="colorInput">線の色（C）:</label>
    <input type="color" id="colorInput" value="#000000">

    <label><input type="checkbox" id="eraserToggle"> 消しゴム (E)</label>
    <label><input type="checkbox" id="divideToggle"> 10等分モード</label>

    <span id="thicknessLabel">線の太さ:</span>
    <button id="decreaseBtn">-</button>
    <input type="number" id="thicknessInput" min="1" max="100" value="2">
    <button id="increaseBtn">+</button>
    <span>（ショートカット: - と +）</span>

    <button id="exportBtn">エクスポート</button>
    <input type="file" id="importInput" accept=".json" style="display:none;">
    <button id="importBtn">インポート</button>
  </div>

  <div id="exportMenu">
    <button id="exportJsonBtn">JSONで保存</button>
    <button id="exportPngBtn">画像で保存</button>
  </div>

  <canvas id="canvas"></canvas>
  <div id="cursorPreview"></div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const colorInput = document.getElementById('colorInput');
    const eraserToggle = document.getElementById('eraserToggle');
    const divideToggle = document.getElementById('divideToggle');
    const thicknessLabel = document.getElementById('thicknessLabel');
    const thicknessInput = document.getElementById('thicknessInput');
    const decreaseBtn = document.getElementById('decreaseBtn');
    const increaseBtn = document.getElementById('increaseBtn');
    const exportBtn = document.getElementById('exportBtn');
    const exportMenu = document.getElementById('exportMenu');
    const exportJsonBtn = document.getElementById('exportJsonBtn');
    const exportPngBtn = document.getElementById('exportPngBtn');
    const importBtn = document.getElementById('importBtn');
    const importInput = document.getElementById('importInput');
    const cursorPreview = document.getElementById('cursorPreview');

    let drawing = false;
    let erasing = false;
    let divideMode = false;
    let currentColor = colorInput.value;
    let lineWidth = 2;
    let eraserWidth = 20;
    let lastX = 0, lastY = 0;
    let currentStroke = [];
    let moveHistory = [];

    // === 背景色 ===
    const backgroundColor = "#ffffff"; // PNG保存時に塗る背景色

    // === キャンバスサイズ調整 ===
    function resizeCanvas() {
      const toolHeight = document.getElementById('toolMenu').offsetHeight;
      canvas.width = window.innerWidth * 0.95;
      canvas.height = window.innerHeight - toolHeight - 20;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      redrawAll();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();


        // === Undo機能 ===
    function undo() {
      if (moveHistory.length > 0) {
        moveHistory.pop();
        redrawAll();
      }
    }
    undoBtn.onclick = undo;

    window.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key.toLowerCase() === 'z') undo();
      if (e.key === '+') {
        if (erasing) eraserSize++; else penSize++;
        sizeInput.value = erasing ? eraserSize : penSize;
      }
      if (e.key === '-') {
        if (erasing) eraserSize = Math.max(1, eraserSize - 1);
        else penSize = Math.max(1, penSize - 1);
        sizeInput.value = erasing ? eraserSize : penSize;
      }
    });
    
    // === 色変更 ===
    colorInput.addEventListener('input', e => currentColor = e.target.value);

    // === 消しゴム切り替え ===
    eraserToggle.addEventListener('change', e => {
      erasing = e.target.checked;
      updateThicknessDisplay();
      updateCursor({ clientX: lastX, clientY: lastY });
    });

    // === 10等分モード ===
    divideToggle.addEventListener('change', e => divideMode = e.target.checked);

    // === 描画 ===
    canvas.addEventListener('pointerdown', e => {
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
      lastX = e.offsetX;
      lastY = e.offsetY;
      currentStroke = [{ x: e.offsetX, y: e.offsetY }];
    });

    canvas.addEventListener('pointermove', e => {
      updateCursor(e);
      if (!drawing) return;
      const dx = e.offsetX - lastX;
      const dy = e.offsetY - lastY;
      if (dx === 0 && dy === 0) return;
      currentStroke.push({ x: e.offsetX, y: e.offsetY });

      if (erasing) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = eraserWidth;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = lineWidth;
      }
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();

      lastX = e.offsetX;
      lastY = e.offsetY;
    });

    canvas.addEventListener('pointerup', () => {
      if (!drawing) return;
      drawing = false;
      moveHistory.push({
        points: currentStroke,
        color: currentColor,
        width: lineWidth
      });
      if (divideMode && currentStroke.length > 10) drawDivisionMarkers(currentStroke, 10);
    });

    // === 太さ ===
    function updateThicknessDisplay() {
      const currentWidth = erasing ? eraserWidth : lineWidth;
      thicknessInput.value = currentWidth;
      thicknessLabel.textContent = erasing ? '消しゴムの太さ:' : '線の太さ:';
    }
    thicknessInput.addEventListener('input', e => {
      const value = Math.max(1, Math.min(100, parseInt(e.target.value) || 1));
      if (erasing) eraserWidth = value; else lineWidth = value;
      updateCursor({ clientX: lastX, clientY: lastY });
    });
    decreaseBtn.addEventListener('click', () => changeThickness(-1));
    increaseBtn.addEventListener('click', () => changeThickness(1));
    function changeThickness(delta) {
      if (erasing)
        eraserWidth = Math.max(1, Math.min(100, eraserWidth + delta));
      else
        lineWidth = Math.max(1, Math.min(100, lineWidth + delta));
      updateThicknessDisplay();
      updateCursor({ clientX: lastX, clientY: lastY });
    }

    // === ショートカット ===
    window.addEventListener('keydown', e => {
      if (e.key === '-') changeThickness(-1);
      else if (e.key === '+') changeThickness(1);
      else if (e.key.toLowerCase() === 'c') colorInput.click();
      else if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveAsPNG();
      } else if (e.key.toLowerCase() === 'e') {
        eraserToggle.checked = !eraserToggle.checked;
        erasing = eraserToggle.checked;
        updateThicknessDisplay();
        updateCursor({ clientX: lastX, clientY: lastY });
      }
    });

    // === エクスポート ===
    exportBtn.addEventListener('click', e => {
      const rect = exportBtn.getBoundingClientRect();
      exportMenu.style.left = `${rect.left}px`;
      exportMenu.style.top = `${rect.bottom + 5}px`;
      exportMenu.style.display = exportMenu.style.display === 'flex' ? 'none' : 'flex';
    });
    document.addEventListener('click', e => {
      if (!exportBtn.contains(e.target) && !exportMenu.contains(e.target))
        exportMenu.style.display = 'none';
    });

    exportJsonBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(moveHistory)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "drawing.json";
      a.click();
      URL.revokeObjectURL(url);
      exportMenu.style.display = 'none';
    });

    exportPngBtn.addEventListener('click', () => {
      saveAsPNG();
      exportMenu.style.display = 'none';
    });

    // === インポート ===
    importBtn.addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          moveHistory = JSON.parse(reader.result);
          redrawAll();
        } catch {
          alert("JSONファイルが不正です。");
        }
      };
      reader.readAsText(file);
    });

    // === 10等分マーカー ===
    function drawDivisionMarkers(stroke, divisions) {
      const points = stroke;
      let totalLength = 0;
      const segments = [];
      for (let i = 1; i < points.length; i++) {
        const dx = points[i].x - points[i - 1].x;
        const dy = points[i].y - points[i - 1].y;
        const len = Math.sqrt(dx * dx + dy * dy);
        segments.push({ dx, dy, len, x: points[i - 1].x, y: points[i - 1].y });
        totalLength += len;
      }
      const step = totalLength / divisions;
      let dist = 0, currentSeg = 0;
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'red';
      for (let i = 1; i < divisions; i++) {
        const target = step * i;
        while (currentSeg < segments.length && dist + segments[currentSeg].len < target) {
          dist += segments[currentSeg].len;
          currentSeg++;
        }
        if (currentSeg >= segments.length) break;
        const remain = target - dist;
        const ratio = remain / segments[currentSeg].len;
        const x = segments[currentSeg].x + segments[currentSeg].dx * ratio;
        const y = segments[currentSeg].y + segments[currentSeg].dy * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // === 再描画 ===
    function redrawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      moveHistory.forEach(stroke => {
        ctx.beginPath();
        ctx.strokeStyle = stroke.color;
        ctx.lineWidth = stroke.width;
        ctx.globalCompositeOperation = 'source-over';
        ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
        for (let i = 1; i < stroke.points.length; i++)
          ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
        ctx.stroke();
      });
    }

    // === PNG保存（背景付き）===
    function saveAsPNG() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      const tctx = tempCanvas.getContext('2d');

      // 背景を塗る
      tctx.fillStyle = backgroundColor;
      tctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

      // 元キャンバスを上に描画
      tctx.drawImage(canvas, 0, 0);

      const link = document.createElement('a');
      link.download = 'drawing.png';
      link.href = tempCanvas.toDataURL('image/png');
      link.click();
    }

    // === カーソル ===
    function updateCursor(e) {
      const size = erasing ? eraserWidth : lineWidth;
      cursorPreview.style.width = `${size}px`;
      cursorPreview.style.height = `${size}px`;
      cursorPreview.style.left = `${e.clientX - size / 2}px`;
      cursorPreview.style.top = `${e.clientY - size / 2}px`;
      cursorPreview.style.borderColor = erasing ? 'red' : '#666';
    }

    updateThicknessDisplay();
  </script>
</body>
</html>
