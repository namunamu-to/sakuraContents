<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリの修正</title>
</head>

<body>
  <script src="js/header.js"></script>

  <img src="./img/app_header.png" class="hero-image">

  <main>
    <section>
      <h1>アプリの紹介</h1>
    </section>

    <section>
      <div class="hr"></div>
    </section>

    <section class="flex">
      <img src="./img/open_solitaire.png" style="width: 6rem; height: auto;">
      <span style="padding-left: 1rem;">
        <h2>Open Solitaire</h2>
        <p>一般的なシンプルなソリティアトランプゲームです。</p>
      </span>
    </section>


    <section>
      <h2>iPhoneスクリーンショット</h2>
      <img src="./img/open_solitaire_screen_shot.png" style="width: 100%;">
    </section>

    <section>
      <div class="hr"></div>
    </section>






    <div class="flex">
      <span>
        <section>
          <h2>のび太の恐竜iPad版</h2>
          <p>小学館様で作業をさせて頂いておりました。</p>
          <p>「のび太の恐竜」iPad版が公開されました。</p>
        </section>

        <section>
          <h2>しながわ水族館内座間味村紹介アプリ</h2>
          <p>しながわ水族館内の座間味村紹介コーナーで、</p>
          <p>クジラクイズや座間味村のご紹介をするiPadアプリを作成しました。</p>
        </section>

        <section>
          <h2>恐怖のグレイヴ顔〜あなたも”恐怖のグレイヴ顔”になれる！〜</h2>
          <p>iPhoneアプリの制作をお手伝いさせて頂きました。</p>
        </section>
      </span>

      <section>

        <img src="./img/nobita_aquarium.png" style="width: 350px; height: 451px;">
      </section>
    </div>


    <section>
      <div class="hr"></div>
    </section>
  </main>


  <footer></footer>

  <style>
    body {
      margin: 0;
    }

    .flex {
      display: flex;
    }

    .hero-image {
      width: 100%;
      height: 340px;
    }

    @media only screen and (max-width: 479px) {
      .hero-image {
        height: 250px;
      }
    }

    .hr {
      background-color: rgba(0, 0, 0, 0.150000006);
      height: 1px;
    }

    section {
      width: 85%;
      margin-left: auto;
      margin-right: auto;
      padding: 2rem 0;
    }


    footer {
      background-color: rgba(50, 50, 50, 1);
      height: 4.5rem;
    }
  </style>
</body>

</html>
