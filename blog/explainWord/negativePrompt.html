        <h1>ネガティブプロンプトとは</h1>
        <h2>解説</h2>
        <p>ネガティブプロンプトとは、画像生成AIに写ってほしくない物を命令する文である</p>
        <p>例えば純粋な猫の画像を作りたい時、人間が混ざることがあります。</p>
        <p>そういった時に「human」という文字列(ネガティブプロンプト)を画像生成AIに渡してあげると、猫だけが移った画像が生成されやすくなります。</p>
    </main>
