        <h1>画像生成におけるプロンプトとは</h1>
        <h2>解説</h2>
        <p>画像生成におけるプロンプトとは、画像生成AIに、何の画像を生成するかを命令する文である</p>
        <p>例えば"girl,cat,stand"という風に、単語をカンマ区切りで並べた文字列がプロンプトである</p>
        <p>"girl,cat,stand"という文字列(プロンプト)を画像生成AIに渡してあげると、「立っている猫耳女の子」の画像が出来上がる</p>
